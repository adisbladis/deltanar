syntax = "proto3";

package delta;

option go_package = "github.com/adisbladis/deltanar/internal/delta";

// A Delta reconstructs a target byte slice from a "base" (reference) file
message Delta {
    repeated Op ops = 1;

    message Op {
        oneof op {
            Copy copy = 1; // Copy from bas
            bytes insert = 2; // Insert literal bytes
        }
    }

    message Copy {
        uint64 offset = 1;
        uint64 length = 2;
    }
}
